name: Rebuild experience PNGs

on:
  push:
    branches: [main]
    paths:
      - '.image-upload/READY'

permissions:
  contents: write

concurrency:
  group: rebuild-experience-images
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild original PNG files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p images/experience
          for i in 1 2 3 4 5 6; do
            cat .image-upload/${i}.*.part | tr -d '\n\r' | base64 --decode > images/experience/${i}.png
            file images/experience/${i}.png
          done
      - name: Commit reconstructed images and remove temporary parts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .image-upload
          rm -f .github/workflows/rebuild-experience-images.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/experience .github/workflows/rebuild-experience-images.yml .image-upload || true
          git commit -m "assets: add original experience PNGs"
          git push
